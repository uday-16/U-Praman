<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Reports — PRAMAN Workspace</title>
  <script>
    (function() {
      var saved = localStorage.getItem('praman_lang') || localStorage.getItem('standardsai_lang');
      if (saved && saved !== 'en') {
        document.cookie = 'googtrans=/en/' + saved + '; path=/;';
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          document.cookie = 'googtrans=/en/' + saved + '; domain=' + window.location.hostname + '; path=/;';
        }
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/praman-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    html:not([data-workspace-authenticated]) body { visibility: hidden; }
    .reports-table-container {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.02);
    }
    .reports-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }
    .reports-table th {
      background-color: #F8FAFC;
      color: #64748B;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #E2E8F0;
    }
    .reports-table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #E2E8F0;
      color: #17324D;
      vertical-align: middle;
    }
    .reports-table tr:last-child td {
      border-bottom: none;
    }
    .reports-table tr:hover td {
      background-color: #F8FAFC;
    }
    .truncate-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
      display: block;
    }
  </style>
  <script type="module" src="/js/utils/workspace-guard.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <div class="app-main-wrapper">
      <div id="topbar-root"></div>

      <main class="app-content" style="padding: 2.25rem 2.5rem; max-width: 1200px; margin: 0 auto; width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h1 style="font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 30px; font-weight: 700; color: #123F63; margin: 0 0 0.35rem 0; letter-spacing: -0.02em;">
              Generated Reports
            </h1>
            <p style="font-size: 0.92rem; color: #64748B; margin: 0;">
              Review generated procurement standards reports for official documentation files.
            </p>
          </div>
          <a href="/pages/report-view.html" class="btn" style="background: #123F63; color: #FFFFFF; font-weight: 600; padding: 0.65rem 1.25rem; border-radius: 6px; text-decoration: none; font-size: 0.88rem; box-shadow: 0 1px 3px rgba(18,63,99,0.15);">
            + Create New Report
          </a>
        </div>

        <div class="reports-table-container">
          <table class="reports-table">
            <thead>
              <tr>
                <th style="width: 18%;">Report ID</th>
                <th style="width: 38%;">Requirement</th>
                <th style="width: 16%;">Standards</th>
                <th style="width: 14%;">Created</th>
                <th style="width: 14%; text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="reports-table-body">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module">
    import { workspaceReady } from '/js/utils/workspace-guard.js';
    import { renderAppSidebar, renderAppTopbar, initSidebarEvents, initTopbarEvents } from '/js/components/sidebar.js';
    import { api, escapeHtml as esc } from '/js/utils/api.js';

    workspaceReady.then(async allowed => {
      if (!allowed) return;

      document.getElementById('sidebar-root').innerHTML = renderAppSidebar('reports');
      document.getElementById('topbar-root').innerHTML = renderAppTopbar('Workspace / Generated reports');
      initSidebarEvents();
      initTopbarEvents();

      let reports = [];
      try {
        reports = await api('/reports');
      } catch (err) {
        console.warn('Could not load reports from API:', err);
      }

      const combined = (reports || []).map(r => ({
        id: r.id,
        title: r.product_name || r.title || 'Procurement Standards Report',
        standardsCount: (r.analysis && r.analysis.recommendations ? r.analysis.recommendations.length : 0),
        date: r.created_at || 'Recent',
        linkId: r.id
      }));


      const tbody = document.getElementById('reports-table-body');
      if (combined.length > 0) {
        tbody.innerHTML = combined.map(r => `
          <tr>
            <td style="font-weight: 700; color: #123F63; font-size: 0.86rem; letter-spacing: -0.01em;">
              ${r.id}
            </td>
            <td>
              <span class="truncate-text" title="${r.title}" style="font-weight: 600; color: #17324D;">
                ${r.title}
              </span>
            </td>
            <td style="color: #52657A; font-weight: 500;">
              ${r.standardsCount} Standards
            </td>
            <td style="color: #64748B; font-size: 0.84rem;">
              ${r.date}
            </td>
            <td style="text-align: right;">
              <a href="/pages/report-view.html?id=${encodeURIComponent(r.linkId)}" style="display: inline-flex; align-items: center; font-size: 0.84rem; font-weight: 600; color: #123F63; text-decoration: none; padding: 5px 12px; border-radius: 4px; border: 1px solid #CBD5E1; background: #FFFFFF; transition: all 0.15s ease;">
                View report &rarr;
              </a>
            </td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: 3rem 1.5rem; color: #64748B;">
              <div style="font-weight: 600; font-size: 0.95rem; color: #17324D; margin-bottom: 0.35rem;">No reports generated yet</div>
              <div style="font-size: 0.85rem; margin-bottom: 1.25rem;">Analyze a procurement requirement to generate your first standards review report.</div>
              <a href="/pages/analyze.html" class="btn" style="background: #123F63; color: #FFFFFF; font-weight: 600; padding: 0.5rem 1.25rem; border-radius: 6px; text-decoration: none; font-size: 0.88rem; display: inline-block;">
                + Analyze Requirement
              </a>
            </td>
          </tr>
        `;
      }
    });
  </script>
</body>
</html>
