<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standards Explorer — PRAMAN Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/praman-mark.svg">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/standards.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <div class="app-main-wrapper">
      <div id="topbar-root"></div>

      <main class="app-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
          <div>
            <h1 class="page-title">Standards explorer</h1>
            <p class="page-subtitle">Search, filter, and compare available Indian Standards records.</p>
          </div>
          <a href="/pages/compare.html" class="btn btn-secondary btn-sm" style="font-weight: 700;">Compare matrix</a>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar" style="background: white; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
          <div style="flex: 1; min-width: 260px;">
            <input type="text" id="standards-search-input" class="form-input" placeholder="Search by code, title, or category..." />
          </div>

          <div class="filter-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="filter-label" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);">Category:</span>
            <select id="filter-category" class="form-select" style="padding: 0.35rem 0.75rem;">
              <option value="All">All Categories</option>
              <option value="Personal Protective Equipment (PPE)">Personal Protective Equipment</option>
              <option value="Civil Infrastructure & Steel">Civil Infrastructure</option>
              <option value="Electrical Equipment">Electrical Equipment</option>
            </select>
          </div>

          <div class="filter-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="filter-label" style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);">Status:</span>
            <select id="filter-status" class="form-select" style="padding: 0.35rem 0.75rem;">
              <option value="All">All Statuses</option>
              <option value="Active">Active</option>
              <option value="Replaced">Superseded</option>
            </select>
          </div>
        </div>

        <!-- Counter -->
        <div style="font-size: 0.875rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 1rem;" id="results-count">
          Showing 3 Indian Standards
        </div>

        <!-- Standards Table -->
        <div class="data-table-wrapper" style="background: white; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
          <table class="data-table">
            <thead>
              <tr>
                <th>Standard Code</th>
                <th>Title</th>
                <th>Category</th>
                <th>Status</th>
                <th>Year</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="standards-tbody">
              <!-- Dynamically rendered -->
            </tbody>
          </table>
        </div>

        <!-- Empty State -->
        <div id="empty-state" style="display: none; text-align: center; padding: 4rem 2rem; background: white; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-top: 1rem;">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom: 1rem;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">No standards match search</h3>
          <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Try adjusting query or filter selection.</p>
          <button id="reset-search-btn" class="btn btn-secondary btn-sm" style="font-weight: 700;">Reset search</button>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module">
    import { renderAppSidebar, renderAppTopbar } from '/js/components/sidebar.js';
    import { mockStandards } from '/js/data/standards.js';
    import { Storage } from '/js/utils/storage.js';
    import { showToast } from '/js/components/toast.js';

    document.getElementById('sidebar-root').innerHTML = renderAppSidebar('standards');
    document.getElementById('topbar-root').innerHTML = renderAppTopbar('Workspace / Standards explorer');

    const searchInput = document.getElementById('standards-search-input');
    const filterCat = document.getElementById('filter-category');
    const filterStatus = document.getElementById('filter-status');
    const tbody = document.getElementById('standards-tbody');
    const countEl = document.getElementById('results-count');
    const emptyState = document.getElementById('empty-state');

    function renderTable() {
      const q = searchInput.value.toLowerCase().trim();
      const cat = filterCat.value;
      const stat = filterStatus.value;

      const filtered = mockStandards.filter(s => {
        const matchesQuery = !q || s.isNumber.toLowerCase().includes(q) || s.title.toLowerCase().includes(q) || s.category.toLowerCase().includes(q) || s.scope.toLowerCase().includes(q);
        const matchesCat = cat === 'All' || s.category === cat;
        const matchesStat = stat === 'All' || s.status === stat;

        return matchesQuery && matchesCat && matchesStat;
      });

      countEl.innerText = `Showing ${filtered.length} Indian Standard${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        tbody.innerHTML = filtered.map(s => {
          const isSaved = Storage.isStandardSaved(s.id);
          return `
            <tr>
              <td style="font-weight: 800; color: var(--primary-blue);">${s.isNumber}</td>
              <td style="font-weight: 700;">${s.title}</td>
              <td><span class="badge badge-neutral">${s.category}</span></td>
              <td><span class="badge badge-success">${s.status}</span></td>
              <td>${s.year}</td>
              <td>
                <div style="display: flex; gap: 0.5rem;">
                  <a href="/pages/standard-details.html?id=${s.id}" class="btn btn-secondary btn-sm" style="font-weight:700;">View</a>
                  <button class="btn btn-secondary btn-sm save-toggle-btn" data-id="${s.id}" style="font-weight:700;">
                    ${isSaved ? 'Saved' : 'Save'}
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }
    }

    searchInput.addEventListener('input', renderTable);
    filterCat.addEventListener('change', renderTable);
    filterStatus.addEventListener('change', renderTable);

    document.getElementById('reset-search-btn').addEventListener('click', () => {
      searchInput.value = '';
      filterCat.value = 'All';
      filterStatus.value = 'All';
      renderTable();
    });

    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('save-toggle-btn')) {
        const id = e.target.dataset.id;
        const saved = Storage.toggleSaveStandard(id);
        e.target.innerText = saved ? 'Saved' : 'Save';
        showToast(saved ? 'Standard saved' : 'Standard removed', saved ? 'success' : 'info');
      }
    });

    renderTable();
  </script>
</body>
</html>
