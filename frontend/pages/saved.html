<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Standards — PRAMAN Workspace</title>
  <script>
    (function() {
      var saved = localStorage.getItem('praman_lang') || localStorage.getItem('standardsai_lang');
      if (saved && saved !== 'en') {
        document.cookie = 'googtrans=/en/' + saved + '; path=/;';
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          document.cookie = 'googtrans=/en/' + saved + '; domain=' + window.location.hostname + '; path=/;';
        }
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/praman-mark.svg">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/standards.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>html:not([data-workspace-authenticated]) body { visibility: hidden; }</style>
  <script type="module" src="/js/utils/workspace-guard.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <div class="app-main-wrapper">
      <div id="topbar-root"></div>

      <main class="app-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
          <div>
            <h1 class="page-title">Saved standards</h1>
            <p class="page-subtitle">Quick access to bookmarked Indian Standards records.</p>
          </div>
          <a href="/pages/standards.html" class="btn btn-secondary btn-sm" style="font-weight: 700;">Explore standards catalog</a>
        </div>

        <div id="saved-cards-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
          <!-- Dynamically rendered -->
        </div>

        <!-- Empty State -->
        <div id="saved-empty" style="display: none; text-align: center; padding: 4rem 2rem; background: white; border: 1px solid var(--border-color); border-radius: var(--radius-md);">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" style="margin-bottom: 1rem;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">Save standards you want to review later</h3>
          <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1.5rem;">Explore standards or analyze a requirement to save standards to your bookmarks.</p>
          <a href="/pages/standards.html" class="btn btn-primary" style="font-weight: 800;">Explore standards</a>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module">
    import { workspaceReady } from '/js/utils/workspace-guard.js';
    import { renderAppSidebar, renderAppTopbar, initSidebarEvents, initTopbarEvents } from '/js/components/sidebar.js';
    import { api, escapeHtml as esc } from '/js/utils/api.js';
    import { Storage } from '/js/utils/storage.js';
    import { showToast } from '/js/components/toast.js';
    import { mockStandards, sampleStandards } from '/js/data/standards.js';

    workspaceReady.then(async allowed => {
      if (!allowed) return;

      document.getElementById('sidebar-root').innerHTML = renderAppSidebar('saved');
      document.getElementById('topbar-root').innerHTML = renderAppTopbar('Workspace / Saved');

      initSidebarEvents(); initTopbarEvents();
      const grid = document.getElementById('saved-cards-grid');
      const empty = document.getElementById('saved-empty');

      const fallbackCatalog = [...(sampleStandards || []), ...(mockStandards || [])];
      let catalog = [...fallbackCatalog];
      try {
        const remote = await api('/standards');
        if (Array.isArray(remote) && remote.length > 0) {
          // Merge remote standards with local catalog
          const remoteIds = new Set(remote.map(r => r.id.toLowerCase()));
          catalog = [...remote, ...fallbackCatalog.filter(f => !remoteIds.has(f.id.toLowerCase()))];
        }
      } catch (error) {
        console.warn('Remote standards unavailable, using local repository standards:', error);
      }

      function renderSaved() {
        const savedIds = Storage.getSavedStandards();
        const savedStandards = [];
        const seen = new Set();

        for (const s of catalog) {
          const sid = (s.id || '').toLowerCase();
          const sCode = (s.is_number || s.isNumber || s.code || '').toLowerCase().replace(/[\s:]+/g, '-');
          if (savedIds.some(id => {
            const clean = id.toLowerCase();
            return clean === sid || clean === sCode || clean.replace(/-/g, '') === sid.replace(/-/g, '');
          })) {
            if (!seen.has(sid)) {
              seen.add(sid);
              savedStandards.push(s);
            }
          }
        }

        if (savedStandards.length === 0) {
          grid.style.display = 'none';
          empty.style.display = 'block';
        } else {
          empty.style.display = 'none';
          grid.style.display = 'grid';
          grid.innerHTML = savedStandards.map(s => {
            const isNum = s.is_number || s.isNumber || s.code || s.id;
            const title = s.title || 'Indian Standard';
            const category = s.category || 'General';
            const status = s.status || 'Active';
            const year = s.year || s.version || (s.reviewedYear ? String(s.reviewedYear) : '2024');
            const scopeText = (s.scope || s.description || 'Official Indian Standard specification and compliance benchmarks.').replace(/\s+/g, ' ').trim();
            const preview = scopeText.length > 220 ? scopeText.slice(0, 220).replace(/\s+\S*$/, '') + '…' : scopeText;
            const targetId = s.id || isNum;

            return `
              <div class="card card-hover" style="display: flex; flex-direction: column; justify-content: space-between; background: white; border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow-xs);">
                <div>
                  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                    <span class="badge badge-primary" style="font-weight: 700; font-size: 0.75rem;">${esc(category)}</span>
                    <button class="btn btn-secondary btn-sm remove-saved-btn" data-id="${esc(targetId)}" title="Remove Bookmark" style="color: #dc2626; font-weight: 700; font-size: 0.8rem; padding: 0.25rem 0.6rem;">✕ Remove</button>
                  </div>
                  <h3 style="font-size: 1.15rem; font-weight: 800; color: #123F63; margin-bottom: 0.35rem; line-height: 1.3;">${esc(isNum)}</h3>
                  <div style="font-weight: 700; font-size: 0.92rem; color: #1e293b; margin-bottom: 0.75rem; line-height: 1.4;">${esc(title)}</div>
                  <p style="font-size: 0.85rem; color: #64748B; line-height: 1.55; margin-bottom: 1.25rem;">${esc(preview)}</p>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; padding-top: 0.875rem;">
                  <span class="badge badge-success" style="font-weight: 700;">${esc(status)} (${esc(year)})</span>
                  <a href="/pages/standard-details.html?id=${encodeURIComponent(targetId)}" class="btn btn-primary btn-sm" style="font-weight: 700;">View details →</a>
                </div>
              </div>
            `;
          }).join('');
        }
      }

      document.addEventListener('click', (e) => {
        const removeBtn = e.target.closest('.remove-saved-btn');
        if (removeBtn) {
          const id = removeBtn.dataset.id;
          Storage.toggleSaveStandard(id);
          showToast('Standard removed from bookmarks', 'info');
          renderSaved();
        }
      });

      renderSaved();
    });
  </script>
</body>
</html>
