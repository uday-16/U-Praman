<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — PRAMAN Workspace</title>
  <script>
    (function() {
      var saved = localStorage.getItem('praman_lang') || localStorage.getItem('standardsai_lang');
      if (saved && saved !== 'en') {
        document.cookie = 'googtrans=/en/' + saved + '; path=/;';
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          document.cookie = 'googtrans=/en/' + saved + '; domain=' + window.location.hostname + '; path=/;';
        }
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/praman-mark.svg">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>html:not([data-workspace-authenticated]) body { visibility: hidden; }</style>
  <script type="module" src="/js/utils/workspace-guard.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <div class="app-main-wrapper">
      <div id="topbar-root"></div>

      <main class="app-content">
        <div style="margin-bottom: 2rem;">
          <h1 class="page-title">Workspace settings</h1>
          <p class="page-subtitle">Configure language, notifications, and accessibility preferences.</p>
        </div>

        <div class="card" style="max-width: 680px; background: white; border: 1px solid var(--border-color); padding: 2rem;">
          <!-- Language Preference -->
          <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
            <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 0.5rem;">Language</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">Select default interface language for procurement workflows across the entire portal.</p>
            
            <div class="form-group" style="max-width: 320px;">
              <label class="form-label" for="lang-select" style="font-weight: 700;">Interface language</label>
              <select id="lang-select" class="form-select">
                <option value="en">English (EN)</option>
                <option value="hi">हिन्दी (Hindi)</option>
                <option value="te">తెలుగు (Telugu)</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="bn">বাংলা (Bengali)</option>
                <option value="mr">मराठी (Marathi)</option>
                <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                <option value="gu">ગુજરાતી (Gujarati)</option>
                <option value="kn">ಕನ್ನಡ (Kannada)</option>
                <option value="ml">മലയാളം (Malayalam)</option>
                <option value="or">ଓଡ଼ିଆ (Odia)</option>
                <option value="ur">اردو (Urdu)</option>
                <option value="as">অসমীয়া (Assamese)</option>
              </select>
            </div>
          </div>

          <!-- Notification Preferences -->
          <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
            <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 0.5rem;">Notifications</h3>
            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
              <label style="display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; cursor: pointer; font-weight: 600;">
                <input type="checkbox" id="notif-analysis" checked />
                <span>Notify when requirement analysis is completed</span>
              </label>
              <label style="display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; cursor: pointer; font-weight: 600;">
                <input type="checkbox" id="notif-report" checked />
                <span>Notify when new standard amendment is detected</span>
              </label>
            </div>
          </div>

          <!-- Accessibility -->
          <div style="margin-bottom: 1.5rem;">
            <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 0.5rem;">Accessibility</h3>
            <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
              <label style="display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; cursor: pointer; font-weight: 600;">
                <input type="checkbox" id="acc-reduced-motion" />
                <span>Prefer reduced motion</span>
              </label>
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end;">
            <button id="save-settings-btn" class="btn btn-primary" style="font-weight: 800;">Save settings</button>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module">
    import { workspaceReady } from '/js/utils/workspace-guard.js';
    import { renderAppSidebar, renderAppTopbar } from '/js/components/sidebar.js';
    import { showToast } from '/js/components/toast.js';
    import { changeLanguage, bindLanguageSelects } from '/js/utils/translator.js';
    workspaceReady.then(allowed => {
      if (!allowed) return;

      document.getElementById('sidebar-root').innerHTML = renderAppSidebar('settings');
      document.getElementById('topbar-root').innerHTML = renderAppTopbar('Workspace / Settings');

      const langDropdown = document.getElementById('lang-select');
      bindLanguageSelects();

      document.getElementById('save-settings-btn').addEventListener('click', () => {
        const selected = langDropdown ? langDropdown.value : 'en';
        changeLanguage(selected);
        showToast('Workspace settings saved successfully', 'success');
      });

    });
  </script>
</body>
</html>
