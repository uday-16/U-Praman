<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurement Standards Review Report — PRAMAN</title>
  <script>
    (function() {
      var saved = localStorage.getItem('praman_lang') || localStorage.getItem('standardsai_lang');
      if (saved && saved !== 'en') {
        document.cookie = 'googtrans=/en/' + saved + '; path=/;';
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          document.cookie = 'googtrans=/en/' + saved + '; domain=' + window.location.hostname + '; path=/;';
        }
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/praman-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;0,8..60,800;1,8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/reports.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    html:not([data-workspace-authenticated]) body { visibility: hidden; }
    
    .report-paper {
      background: #FFFFFF;
      max-width: 880px;
      margin: 0 auto;
      padding: 3rem 3.5rem;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      box-shadow: 0 4px 12px rgba(18, 63, 99, 0.08);
      color: #1E293B;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.85rem 0 1.25rem 0;
      font-size: 0.86rem;
    }
    .report-table th {
      background: #F8FAFC;
      color: #123F63;
      font-weight: 700;
      text-align: left;
      padding: 0.65rem 0.85rem;
      border: 1px solid #CBD5E1;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .report-table td {
      padding: 0.65rem 0.85rem;
      border: 1px solid #E2E8F0;
      vertical-align: top;
      color: #1E293B;
    }

    .evidence-quote-box {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-left: 3px solid #123F63;
      padding: 0.75rem 1rem;
      border-radius: 2px;
      margin: 0.5rem 0 0.85rem 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.55;
      color: #0F172A;
    }

    @media print {
      body { background: white !important; }
      .no-print, #sidebar-root, #topbar-root { display: none !important; }
      .app-layout, .app-main-wrapper, .app-content { padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
      .report-paper {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
      }
      @page {
        size: A4;
        margin: 15mm 15mm 15mm 15mm;
      }
      .page-break-before { page-break-before: always; }
    }
  </style>
  <script type="module" src="/js/utils/workspace-guard.js"></script>
</head>
<body style="background: var(--bg-main, #F1F5F9);">
  <div class="app-layout">
    <div id="sidebar-root" class="no-print"></div>
    <div class="app-main-wrapper">
      <div id="topbar-root" class="no-print"></div>

      <main class="app-content" style="padding: 2rem 1.5rem;">
        <!-- Top Action Toolbar (Phase 10 & 12) -->
        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; max-width: 880px; margin-left: auto; margin-right: auto;">
          <a href="/pages/reports.html" style="font-size: 0.88rem; color: #123F63; font-weight: 700; text-decoration: none;">← Back to reports</a>
          <div style="display: flex; gap: 0.75rem;">
            <button onclick="window.print()" class="btn btn-secondary btn-sm" style="font-weight: 700; border: 1px solid #CBD5E1; padding: 0.5rem 1rem;">🖨 Print report</button>
            <button id="download-report-btn" class="btn btn-primary btn-sm" style="font-weight: 700; background: #123F63; color: white; padding: 0.5rem 1.25rem;">📥 Download PDF</button>
          </div>
        </div>

        <!-- Official Report Paper Document (Phase 10) -->
        <div class="report-paper" id="report-paper">
          <div style="text-align: center; padding: 3rem; color: #64748B;">
            Loading official procurement report...
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module">
    import { workspaceReady } from '/js/utils/workspace-guard.js';
    import { renderAppSidebar, renderAppTopbar, initSidebarEvents, initTopbarEvents } from '/js/components/sidebar.js';
    import { api, escapeHtml as esc } from '/js/utils/api.js';
    import { Storage } from '/js/utils/storage.js';

    workspaceReady.then(async allowed => {
      if (!allowed) return;

      document.getElementById('sidebar-root').innerHTML = renderAppSidebar('reports');
      document.getElementById('topbar-root').innerHTML = renderAppTopbar('Workspace / Report preview');
      initSidebarEvents();
      initTopbarEvents();

      const urlParams = new URLSearchParams(window.location.search);
      const reportOrAnalysisId = urlParams.get('id') || urlParams.get('analysis_id') || urlParams.get('report_id');

      const user = Storage.getUser() || {};
      const officerName = user.full_name || user.name || 'Uday Kiran';
      const officerRole = user.role || 'Procurement Officer';
      const officerDept = user.department || 'Central Procurement Division';

      let reportData = null;
      let targetReportId = null;

      try {
        if (reportOrAnalysisId) {
          // Fetch report directly from backend (Phase 9 & 10)
          reportData = await api('/reports/' + encodeURIComponent(reportOrAnalysisId));
          targetReportId = reportData.id;
        } else {
          // Fetch the most recent report from backend
          const allReports = await api('/reports');
          if (allReports && allReports.length > 0) {
            reportData = allReports[allReports.length - 1];
            targetReportId = reportData.id;
          }
        }
      } catch (err) {
        console.warn('Could not fetch report from backend, trying local analysis fallback:', err);
      }

      // If backend did not have an existing report, try fetching analysis to generate preview
      if (!reportData && reportOrAnalysisId) {
        try {
          const analysis = await api('/analysis/' + encodeURIComponent(reportOrAnalysisId));
          if (analysis) {
            // Create a real report for this analysis on the fly
            reportData = await api('/reports', {
              method: 'POST',
              body: { analysis_id: analysis.id, officer_name: officerName }
            });
            targetReportId = reportData.id;
          }
        } catch (e) {
          console.error('Error generating report from analysis:', e);
        }
      }

      const paper = document.getElementById('report-paper');
      if (!reportData || !reportData.analysis) {
        paper.innerHTML = `
          <div style="text-align: center; padding: 4rem 1.5rem;">
            <h2 style="color: #123F63; margin-bottom: 0.5rem;">No Report Found</h2>
            <p style="color: #64748B; margin-bottom: 1.5rem;">Select a valid completed analysis to generate an official procurement report.</p>
            <a href="/pages/analyze.html" class="btn btn-primary" style="text-decoration: none; padding: 0.6rem 1.25rem;">Start New Analysis</a>
          </div>
        `;
        return;
      }

      const analysis = reportData.analysis;
      const ext = analysis.extracted || {};
      const recs = analysis.recommendations || [];
      const comp = analysis.completeness || { score: 80, items: [], recommendations_to_improve: [] };

      // Render official report preview (Phase 10)
      paper.innerHTML = `
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #123F63; padding-bottom: 1rem; margin-bottom: 1.5rem;">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 0.5rem;">
              <span style="font-weight: 800; font-size: 1.4rem; color: #123F63; letter-spacing: 0.05em;">PRAMAN</span>
              <span style="font-size: 0.8rem; background: #E0F2FE; color: #0369A1; font-weight: 700; padding: 2px 6px; border-radius: 3px;">OFFICIAL REPORT</span>
            </div>
            <h1 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 1.35rem; font-weight: 700; color: #123F63; margin: 0;">
              PROCUREMENT STANDARDS REVIEW REPORT
            </h1>
            <div style="font-size: 0.82rem; color: #64748B; margin-top: 0.25rem;">Decision-Support Documentation for Public Procurement Specifications</div>
          </div>
          <div style="text-align: right; font-size: 0.82rem;">
            <div>Report ID: <strong style="color: #123F63;">${esc(reportData.id)}</strong></div>
            <div style="color: #64748B; margin-top: 0.2rem;">Generated: <strong>${esc(reportData.created_at || 'Current')}</strong></div>
            <div style="color: #64748B; margin-top: 0.2rem;">Authority: <strong>${esc(officerDept)}</strong></div>
          </div>
        </div>

        <!-- Metadata Grid -->
        <table class="report-table" style="background: #F8FAFC; margin-bottom: 1.5rem;">
          <tr>
            <td style="width: 25%; font-weight: 700; color: #475569;">Procurement Product:</td>
            <td style="width: 35%; font-weight: 600; color: #123F63;">${esc(ext.product_name)}</td>
            <td style="width: 20%; font-weight: 700; color: #475569;">Prepared By:</td>
            <td style="width: 20%; font-weight: 600;">${esc(reportData.officer_name || officerName)}</td>
          </tr>
          <tr>
            <td style="font-weight: 700; color: #475569;">Intended Application:</td>
            <td>${esc(ext.application || 'General procurement')}</td>
            <td style="font-weight: 700; color: #475569;">Verification Status:</td>
            <td><strong style="color: #15803D;">COMPLETED</strong></td>
          </tr>
          <tr>
            <td style="font-weight: 700; color: #475569;">Retrieval Engine:</td>
            <td>Hybrid RAG (${esc(analysis.retrieval_mode || 'Semantic + BM25')})</td>
            <td style="font-weight: 700; color: #475569;">Completeness Score:</td>
            <td><strong style="color: ${comp.score >= 80 ? '#15803D' : '#B45309'};">${comp.score} / 100</strong></td>
          </tr>
        </table>

        <!-- 1. Procurement Requirement & Extracted Specifications -->
        <div style="margin-bottom: 1.5rem;">
          <h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 1.15rem; color: #123F63; border-bottom: 1px solid #E2E8F0; padding-bottom: 0.35rem; margin-bottom: 0.75rem;">
            1. Procurement Requirement &amp; Extracted Specifications
          </h2>
          <div style="background: #F8FAFC; border-left: 3px solid #123F63; padding: 0.85rem 1rem; font-size: 0.88rem; margin-bottom: 1rem; border-radius: 2px;">
            ${esc(ext.source_text || ext.product_name)}
          </div>

          <table class="report-table">
            <tr>
              <th style="width: 30%;">Parameter Category</th>
              <th style="width: 70%;">Extracted Specification</th>
            </tr>
            <tr>
              <td><strong>Key Requirements</strong></td>
              <td>${(ext.key_requirements || []).length ? (ext.key_requirements || []).map(r => `• ${esc(r)}`).join('<br/>') : 'General procurement scope'}</td>
            </tr>
            <tr>
              <td><strong>Technical Specifications</strong></td>
              <td>${Object.entries(ext.technical_parameters || {}).map(([k, v]) => `<strong>${esc(k)}:</strong> ${esc(v)}`).join('<br/>') || 'As per standard industry limits'}</td>
            </tr>
            <tr>
              <td><strong>Safety Parameters</strong></td>
              <td>${(ext.safety_parameters || []).length ? (ext.safety_parameters || []).map(s => `• ${esc(s)}`).join('<br/>') : 'Mandatory BIS safety regulations apply'}</td>
            </tr>
          </table>
        </div>

        <!-- 2. Recommended Indian Standards -->
        <div style="margin-bottom: 1.5rem;">
          <h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 1.15rem; color: #123F63; border-bottom: 1px solid #E2E8F0; padding-bottom: 0.35rem; margin-bottom: 0.75rem;">
            2. Recommended Indian Standards (BIS)
          </h2>
          ${recs.length ? `
            <table class="report-table">
              <thead>
                <tr>
                  <th style="width: 22%;">Standard Code</th>
                  <th style="width: 48%;">Title &amp; Scope Summary</th>
                  <th style="width: 14%;">Relevance</th>
                  <th style="width: 16%;">Latest Status</th>
                </tr>
              </thead>
              <tbody>
                ${recs.map(r => `
                  <tr>
                    <td><strong style="color: #123F63;">${esc(r.is_number)}</strong></td>
                    <td>
                      <strong>${esc(r.title)}</strong>
                      <div style="font-size: 0.8rem; color: #64748B; margin-top: 0.2rem;">${esc((r.reasons && r.reasons[0]) || '')}</div>
                    </td>
                    <td><strong style="color: #0369A1;">${r.score.toFixed(1)}%</strong></td>
                    <td style="font-size: 0.8rem;">${esc(r.latest_version)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : '<p style="color: #B45309;">No sufficiently supported standard was identified in the available knowledge base.</p>'}
        </div>

        <!-- 3. Supporting Evidence & BIS Clause Citations -->
        <div style="margin-bottom: 1.5rem;">
          <h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 1.15rem; color: #123F63; border-bottom: 1px solid #E2E8F0; padding-bottom: 0.35rem; margin-bottom: 0.75rem;">
            3. Supporting Evidence &amp; BIS Clause Citations
          </h2>
          ${recs.slice(0, 3).map(r => `
            <div style="margin-bottom: 1rem;">
              <div style="font-weight: 700; color: #123F63; font-size: 0.9rem; margin-bottom: 0.35rem;">
                Evidence for ${esc(r.is_number)}:
              </div>
              ${(r.evidence || []).slice(0, 3).map((ev, eIdx) => `
                <div style="margin-bottom: 0.5rem;">
                  <div style="font-size: 0.8rem; font-weight: 600; color: #475569;">
                    [Source ${eIdx + 1}] ${esc(ev.source)} · PDF Page ${ev.page}
                  </div>
                  <div class="evidence-quote-box">${esc(ev.text)}</div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        </div>

        <!-- 4. Specification Gaps & Review Items -->
        <div style="margin-bottom: 1.5rem;">
          <h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 1.15rem; color: #123F63; border-bottom: 1px solid #E2E8F0; padding-bottom: 0.35rem; margin-bottom: 0.75rem;">
            4. Specification Completeness &amp; Review Checklist
          </h2>
          <table class="report-table">
            <thead>
              <tr>
                <th style="width: 25%;">Item Checked</th>
                <th style="width: 20%;">Category</th>
                <th style="width: 15%;">Status</th>
                <th style="width: 40%;">Review Details</th>
              </tr>
            </thead>
            <tbody>
              ${(comp.items || []).slice(0, 6).map(it => `
                <tr>
                  <td><strong>${esc(it.label)}</strong></td>
                  <td>${esc(it.category)}</td>
                  <td>
                    <span style="font-weight: 700; font-size: 0.78rem; padding: 2px 6px; border-radius: 3px; background: ${it.status === 'pass' ? '#DCFCE7' : '#FEF3C7'}; color: ${it.status === 'pass' ? '#15803D' : '#B45309'};">
                      ${it.status.toUpperCase()}
                    </span>
                  </td>
                  <td>${esc(it.details)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          ${(comp.recommendations_to_improve || []).length ? `
            <div style="background: #FFFBEB; border: 1px solid #FDE68A; padding: 0.75rem 1rem; border-radius: 4px; font-size: 0.85rem; color: #92400E;">
              <strong>Actionable Recommendations:</strong>
              <ul style="margin: 0.35rem 0 0 1.25rem;">
                ${comp.recommendations_to_improve.map(r => `<li>${esc(r)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
        </div>

        <!-- 5. Traceability Matrix -->
        <div style="margin-bottom: 1.75rem;">
          <h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 1.15rem; color: #123F63; border-bottom: 1px solid #E2E8F0; padding-bottom: 0.35rem; margin-bottom: 0.75rem;">
            5. Traceability Matrix
          </h2>
          <table class="report-table">
            <thead>
              <tr>
                <th style="width: 32%;">Requirement Parameter</th>
                <th style="width: 25%;">Indian Standard</th>
                <th style="width: 28%;">Verification Clause / Source</th>
                <th style="width: 15%;">Status</th>
              </tr>
            </thead>
            <tbody>
              ${(ext.key_requirements || []).slice(0, 5).map((reqItem, idx) => {
                const topRec = recs[0];
                const ev = topRec && topRec.evidence && topRec.evidence[idx % topRec.evidence.length];
                return `
                  <tr>
                    <td>${esc(reqItem)}</td>
                    <td><strong>${topRec ? esc(topRec.is_number) : 'IS Verified'}</strong></td>
                    <td>${ev ? `${esc(ev.source)} (Page ${ev.page})` : 'Clause match'}</td>
                    <td><strong style="color: #15803D;">VERIFIED</strong></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>

        <!-- 6. Authority Sign-Off & Official Disclaimer (Phase 13) -->
        <div style="margin-top: 2rem; border-top: 1.5px solid #CBD5E1; padding-top: 1.25rem;">
          <h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 1.15rem; color: #123F63; margin-bottom: 0.75rem;">
            6. Procurement Authority Sign-Off
          </h2>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; background: #F8FAFC; border: 1px solid #CBD5E1; padding: 1.25rem; border-radius: 4px;">
            <div>
              <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #64748B; margin-bottom: 0.35rem;">Prepared &amp; Verified By:</div>
              <div style="font-size: 1.05rem; font-weight: 700; color: #123F63;">${esc(reportData.officer_name || officerName)}</div>
              <div style="font-size: 0.85rem; color: #475569; margin-top: 0.15rem;">${esc(officerRole)}</div>
              <div style="font-size: 0.82rem; color: #64748B; margin-top: 0.15rem;">${esc(officerDept)}</div>
              <div style="font-size: 0.8rem; color: #64748B; margin-top: 0.35rem;">Date: <strong>${esc(reportData.created_at || 'Current')}</strong></div>
            </div>

            <div>
              <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #64748B; margin-bottom: 0.35rem;">Authorized Signature:</div>
              <div style="height: 48px; border-bottom: 1.5px dashed #94A3B8; margin-bottom: 0.4rem; display: flex; align-items: flex-end; padding-bottom: 4px;">
                <span style="font-family: 'Brush Script MT', cursive, sans-serif; font-size: 1.4rem; color: #1E3A8A; font-weight: 600;">
                  ${esc(reportData.officer_name || officerName)}
                </span>
              </div>
              <div style="font-size: 0.78rem; color: #64748B;">Official Signature / Verification Stamp</div>
            </div>
          </div>

          <div style="margin-top: 1.25rem; font-size: 0.76rem; color: #64748B; line-height: 1.5; border-top: 1px solid #E2E8F0; padding-top: 0.75rem;">
            <strong>Disclaimer:</strong> This report is generated by PRAMAN as a decision-support tool. Referenced Indian Standards and gazette amendments are matched against available repository records. Final compliance, mandatory QCO applicability, and procurement eligibility must be officially verified with the Bureau of Indian Standards (BIS). Bureau of Indian Standards (BIS) marks and names are referenced for technical standard identification and do not imply official BIS certification of this report.
          </div>
        </div>
      `;

      // Download PDF button handler (Phase 11)
      const downloadBtn = document.getElementById('download-report-btn');
      if (downloadBtn && targetReportId) {
        downloadBtn.addEventListener('click', () => {
          downloadBtn.disabled = true;
          downloadBtn.textContent = 'Generating PDF…';
          window.location.assign(`/api/v1/reports/${encodeURIComponent(targetReportId)}/download`);
          setTimeout(() => {
            downloadBtn.disabled = false;
            downloadBtn.textContent = '📥 Download PDF';
          }, 2500);
        });
      }
    });
  </script>
</body>
</html>
