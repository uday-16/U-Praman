<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurement Standards Report — PRAMAN</title>
  <script>
    (function() {
      var saved = localStorage.getItem('praman_lang') || localStorage.getItem('standardsai_lang');
      if (saved && saved !== 'en') {
        document.cookie = 'googtrans=/en/' + saved + '; path=/;';
        if (window.location.hostname && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          document.cookie = 'googtrans=/en/' + saved + '; domain=' + window.location.hostname + '; path=/;';
        }
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/brand/praman-mark.svg">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/typography.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/reports.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>html:not([data-workspace-authenticated]) body { visibility: hidden; }</style>
  <script type="module" src="/js/utils/workspace-guard.js"></script>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root" class="no-print"></div>
    <div class="app-main-wrapper">
      <div id="topbar-root" class="no-print"></div>

      <main class="app-content">
        <!-- Top Toolbar -->
        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; max-width: 900px; margin-left: auto; margin-right: auto;">
          <a href="/pages/reports.html" style="font-size: 0.875rem; color: var(--primary-blue); font-weight: 700; text-decoration: none;">← Back to reports</a>
          <div style="display: flex; gap: 0.75rem;">
            <button onclick="window.print()" class="btn btn-primary btn-sm" style="font-weight: 800;">🖨 Print report</button>
            <button id="download-demo-report-btn" class="btn btn-secondary btn-sm" style="font-weight: 700;">📥 Download PDF</button>
          </div>
        </div>

        <!-- Official Printable Report Document -->
        <div class="report-paper" id="report-paper" style="max-width: 900px; margin: 0 auto; background: white; padding: 3rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-md); border-radius: var(--radius-md);">
          <!-- Dynamic Content -->
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <script type="module">
    import { workspaceReady } from '/js/utils/workspace-guard.js';
    import { renderAppSidebar, renderAppTopbar } from '/js/components/sidebar.js';
    import { showToast } from '/js/components/toast.js';
    import { Storage } from '/js/utils/storage.js';
    workspaceReady.then(allowed => {
      if (!allowed) return;

      document.getElementById('sidebar-root').innerHTML = renderAppSidebar('reports');
      document.getElementById('topbar-root').innerHTML = renderAppTopbar('Workspace / Report view');

      const urlParams = new URLSearchParams(window.location.search);
      const analysisId = urlParams.get('id');
      const analyses = Storage.getAnalyses();
      const analysis = analyses.find(a => a.id === analysisId) || analyses[0];
      const user = Storage.getUser();

      if (analysis) {
        document.getElementById('report-paper').innerHTML = `
            <!-- Header -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--primary-blue); padding-bottom: 1.5rem; margin-bottom: 2rem;">
              <div>
                <img src="/assets/brand/praman-logo.svg" alt="PRAMAN" height="42" style="margin-bottom: 0.75rem;" />
                <h1 style="font-size: 1.5rem; font-weight: 900; color: var(--primary-blue); margin: 0;">PROCUREMENT STANDARDS REVIEW REPORT</h1>
                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Ref: REP-PRAMAN-${analysis.id || '2026-001'}</div>
              </div>
              <div style="text-align: right;">
                <span class="badge badge-success" style="font-weight: 800; font-size: 0.8rem;">Decision Support Document</span>
                <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.5rem;">Date: <strong>${analysis.date || new Date().toLocaleDateString()}</strong></div>
                <div style="font-size: 0.85rem; color: var(--text-secondary);">Authority: ${user?.organization || 'Central Procurement Division'}</div>
              </div>
            </div>

            <!-- 1. Procurement requirement -->
            <div style="margin-bottom: 1.75rem;">
              <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 0.35rem; margin-bottom: 0.75rem;">1. Procurement Requirement</h3>
              <div style="background: var(--bg-main); padding: 1rem; border-radius: var(--radius-sm); border-left: 4px solid var(--primary-blue); font-size: 0.9rem; line-height: 1.6;">
                "${analysis.originalText || analysis.product}"
              </div>
            </div>

            <!-- 2. Extracted specifications -->
            <div style="margin-bottom: 1.75rem;">
              <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 0.35rem; margin-bottom: 0.75rem;">2. Extracted Specifications</h3>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; font-size: 0.875rem;">
                <div><strong>Product:</strong> ${analysis.product}</div>
                <div><strong>Category:</strong> ${analysis.category || 'General'}</div>
                ${(analysis.extractedParams || []).map(p => `<div><strong>${p.name}:</strong> ${p.value}</div>`).join('')}
              </div>
            </div>

            <!-- 3. Recommended standards -->
            <div style="margin-bottom: 1.75rem;">
              <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-blue); border-bottom: 1px solid var(--border-color); padding-bottom: 0.35rem; margin-bottom: 0.75rem;">3. Recommended Standards</h3>
              <table class="data-table" style="font-size: 0.85rem; width: 100%;">
                <thead>
                  <tr>
                    <th>Standard Code</th>
                    <th>Title</th>
                    <th>Match Score</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${(analysis.standards || []).map(s => `
                  <tr>
                    <td style="font-weight: 800; color: var(--primary-blue);">${s.isNumber || s.code}</td>
                    <td>${s.title}</td>
                    <td><span class="badge ${s.matchScore > 85 ? 'badge-success' : 'badge-primary'}" style="font-weight: 800;">${s.matchScore}% Match</span></td>
                    <td>${s.status}</td>
                  </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <!-- 10. Human Review Sign-Off -->
            <div style="border-top: 2px solid var(--border-color); padding-top: 1.5rem; margin-top: 2rem;">
              <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-blue); margin-bottom: 0.75rem;">Review &amp; Sign-Off</h3>
              <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2rem;">
                <div>
                  <div style="font-size: 0.85rem; color: var(--text-secondary);">Prepared by:</div>
                  <div style="font-size: 1rem; font-weight: 800; color: var(--primary-blue);">${user?.name || 'Officer'}</div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">${user?.role || 'Administrator'}</div>
                </div>
                <div style="text-align: right;">
                  <div style="border-bottom: 1px solid var(--text-secondary); width: 180px; margin-bottom: 0.25rem;"></div>
                  <div style="font-size: 0.8rem; color: var(--text-muted);">Authorized Signature &amp; Seal</div>
                </div>
              </div>
            </div>
        `;
      } else {
        document.getElementById('report-paper').innerHTML = '<p>Report not found.</p>';
      }

      document.getElementById('download-demo-report-btn').addEventListener('click', () => {
        showToast('Preparing printable PDF report preview...', 'success');
        setTimeout(() => {
          window.print();
        }, 500);
      });

    });
  </script>
</body>
</html>
