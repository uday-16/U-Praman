<svg width="290" height="48" viewBox="0 0 290 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left Icon Emblem -->
  <g transform="translate(0, 2)">
    <!-- Rounded Blue Container -->
    <rect width="44" height="44" rx="10" fill="url(#praman_emblem_bg)" />
    
    <!-- Top Indian Tricolor Accent Capsule -->
    <g transform="translate(13, 5)">
      <clipPath id="tricolor_pill_clip">
        <rect width="18" height="3" rx="1.5" />
      </clipPath>
      <g clip-path="url(#tricolor_pill_clip)">
        <rect x="0" y="0" width="6" height="3" fill="#FF9933" />
        <rect x="6" y="0" width="6" height="3" fill="#FFFFFF" />
        <rect x="12" y="0" width="6" height="3" fill="#138808" />
      </g>
    </g>

    <!-- White Document Body -->
    <path d="M14 13C14 11.8954 14.8954 11 16 11H24.5L30 16.5V33C30 34.1046 29.1046 35 28 35H16C14.8954 35 14 34.1046 14 33V13Z" fill="#FFFFFF" />
    
    <!-- Document Fold Corner -->
    <path d="M24.5 11V16.5H30" fill="#CBD5E1" />
    
    <!-- Document Clause Lines -->
    <line x1="17.5" y1="17" x2="22" y2="17" stroke="#0B5CAD" stroke-width="1.8" stroke-linecap="round" />
    <line x1="17.5" y1="21" x2="24.5" y2="21" stroke="#0B5CAD" stroke-width="1.8" stroke-linecap="round" />
    <line x1="17.5" y1="25" x2="21" y2="25" stroke="#0B5CAD" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Green Verification Checkmark Circle Badge -->
    <circle cx="26.5" cy="28.5" r="6" fill="#138808" stroke="#FFFFFF" stroke-width="1.6" />
    <path d="M23.8 28.5L25.6 30.3L29.2 26.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(54, 0)">
    <!-- Primary Brand Name "PRAMAN" -->
    <text x="0" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0B3558" letter-spacing="0.5">PRAMAN</text>
    
    <!-- Hindi Brand Translation "प्रमाण" -->
    <text x="108" y="24" font-family="'Noto Sans Devanagari', 'Mukta', 'Kohinoor Devanagari', 'Segoe UI', sans-serif" font-weight="800" font-size="21" fill="#FF8A3D" letter-spacing="0.2">प्रमाण</text>
    
    <!-- Subtitle Tagline -->
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="8.8" fill="#1769AA" letter-spacing="0.7">INDIAN PROCUREMENT STANDARDS PLATFORM</text>
  </g>

  <defs>
    <linearGradient id="praman_emblem_bg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B5CAD" />
      <stop offset="1" stop-color="#063B73" />
    </linearGradient>
  </defs>
</svg>
