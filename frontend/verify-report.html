g Authority: Department of Public Works \u2013 Demonstration Tender\nProject: Construction of a two-lane public road bridge and approach works.\n1. Scope of Procurement\nThe authority intends to procure structural steel and reinforcement-related steel products for a public road bridge.\nSupplied materials shall comply with applicable Indian Standards and be accompanied by inspection and test\ndocumentation.\n2. Material Requirement\nItem\nRequirement\nStructural steel\nHot-rolled structural steel plates, sections and flats for bridge components\nGrade\nHigh-tensile structural steel suitable for welded construction; grade to be proposed by bidder\nReinforcement\nHigh-strength deformed steel bars for reinforced concrete components\nSurface\nFree from harmful defects, excessive rust, cracks, laminations and other detrimental imperfections\nWelding\nWelded fabrication shall follow applicable requirements for carbon/manganese steels\nQuantity\nApproximately 180 metric tonnes structural steel; final quantity as per approved drawings\n3. Technical and Performance Requirements\n\u007f Steel shall possess the specified yield strength, tensile strength, elongation and other mechanical properties required\nfor the proposed grade.\n\u007f Chemical composition shall be within the limits applicable to the selected steel grade.\n\u007f Dimensions, mass and tolerances shall conform to the applicable product specification.\n\u007f For reinforcement bars, rib geometry and mechanical properties shall satisfy the applicable Indian Standard\nrequirements.\n\u007f Materials shall be suitable for fabrication, bolting and/or welding as specified in approved drawings.\n\u007f Manufacturer test certificates and batch/heat identification shall be provided for traceability.\n4. Inspection, Testing and Quality Assurance\n\u007f Chemical analysis and mechanical testing shall be carried out as applicable to the supplied product and grade.\n\u007f Tests shall be performed at an accredited/competent laboratory where required by the contract.\n\u007f The purchaser may inspect material, review test certificates and conduct or witness sampling/testing.\n\u007f Non-conforming material may be rejected according to contract conditions.\n5. Standards / Compliance Clause\nThe bidder shall identify and comply with applicable current Indian Standards for structural steel, structural steel\ndesign, reinforcement steel, loads and relevant welding/fabrication requirements. Where a standard has been\namended or superseded, the applicable current version shall be used unless the contract explicitly specifies otherwise.\n6. Bidder Submission\n\u007f Technical datasheets and proposed steel grade(s).\n\u007f Manufacturer test certificates and heat/batch traceability.\n\u007f Applicable Indian Standards and conformity evidence.\n\u007f Inspection and testing plan.\n\u007f Proposed manufacturer and quality-control details.\nDEMO NOTE: This is a synthetic tender created only for testing the PRAMAN prototype. It is not an actual government\ntender.", "extraction_mode": "gemini", "warning": "", "quantity": "Approximately 180 metric tonnes structural steel; final quantity as per approved drawings", "category": "Structural Steel & Construction Materials", "source_name": "PRAMAN_Demo_Tender_Specification.pdf"}, "recommendations": [{"id": "is-2062-2011", "is_number": "IS 2062 : 2011", "title": "HOT ROLLED MEDIUM AND HIGH TENSILE STRUCTURAL STEEL \u2014 SPECIFICATION", "relevance": "high", "score": 70.8, "reasons": ["Retrieved matching passages from is.2062.2011.pdf. Review the scope and conditions in the evidence.", "Score measures retrieval relevance, not conformity or legal applicability.", "0 separate amendment files for this edition are available locally; review their changes alongside the base text."], "breakdown": {"product_match": "Evidence retrieved", "application_match": "Review source scope", "safety_match": "Not verified", "technical_match": "Not verified"}, "evidence": [{"s st does not give the specified results, two\nadditional tests shall be carried out at random on the\nsame lot. Both retests shall conform to the requirements\nof this standard; otherwise, the lot shall be rejected.\n17.2 Re-heat Treatment\nIf any heat treated material fails to meet the mechanical\nrequirements specified, the supplier may re-heat treat\nthe material and in that case, all mechanical properties\nshall be re-evaluated.\n18 CALCULATION OF MASS\nThe mass of steel shall be calculated on the basis that\nsteel weighs 7.85 g/cm3 .\n19 DELIVERY\nSubject to prior agreement between the purchaser and\nthe manufacturer/supplier, suitable protective treatment\nmay be given to the material after rolling.\n20 MARKING\n20.1 Each product, with the exception of round, square\nand hexagonal bars and flats, shall carry a tag or be\nmarked with the manufacturer\u2019s name or trade-mark. Bars\nand flats shall carry a tag bearing the manufacturer\u2019s\nname or trade-mark. Designation of steel should also\nbe similarly marked on the product or tag.\n20.2 Every heavy, medium structural mill and plate mill\nproduct shall be", "confidence": 0.6877, "verified": false, "source": "is.2062.2011.pdf", "page": 14, "citation_id": "is.2062.2011.pdf:p14:c2", "source_url": "/api/v1/standards/source/is.2062.2011.pdf#page=14"}, {"section": "Source excerpt", "clause": "PDF page 6", "text": "AMENDMENT NO. 1 NOVEMBER 2012\nTO\nIS 2062 : 2011 HOT ROLLED MEDIUM AND HIGH\nTENSILE STRUCTURAL STEEL \u2014 SPECIFICATION\n(Seventh Revision)\n(Page 1, clause 1.1.2) \u2014 Insert a new sub-clause 1.1.3:\n\u20181.1.3 This standard does not include those steels, whi ch are covered by other\nIndian Standards, examples are as follows:\na) Steel plates of drawing quality (see IS 1079);\nb) Steels for boilers and pressure vessels (see IS 2002 and IS 2041);\nc) Steels for structural forming and flanging (see IS 5986);\nd) Steels for the manufacture of welded gas cylinders/containers ( see IS 6240\nand IS 1
