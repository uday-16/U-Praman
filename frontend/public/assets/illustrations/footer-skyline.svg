<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 280" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Deep Navy Background Gradient -->
    <linearGradient id="footerSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="100%" stop-color="#073B75"/>
    </linearGradient>

    <!-- Low-contrast Monochrome Silhouette Fill -->
    <linearGradient id="monochromeSilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#146ED1" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#073B75" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Deep Blue Base -->
  <rect width="1600" height="280" fill="url(#footerSkyGrad)"/>

  <!-- MONOCHROME INDIAN ARCHITECTURAL SKYLINE SILHOUETTE -->
  <g fill="url(#monochromeSilGrad)">
    
    <!-- 1. Gateway of India (Mumbai - Far Left) -->
    <g transform="translate(100, 90) scale(0.7)">
      <path d="M 20 160 L 20 30 L 45 0 L 155 0 L 180 30 L 180 160 L 140 160 L 140 70 Q 100 35 60 70 L 60 160 Z"/>
      <rect x="35" y="-18" width="130" height="18" rx="3"/>
      <path d="M 45 -18 Q 65 -45 85 -18 Z"/>
      <path d="M 115 -18 Q 135 -45 155 -18 Z"/>
    </g>

    <!-- 2. Taj Mahal Silhouette (Agra - Left) -->
    <g transform="translate(380, 70) scale(0.75)">
      <rect x="0" y="30" width="14" height="180"/>
      <rect x="280" y="30" width="14" height="180"/>
      <path d="M -3 30 Q 7 10 17 30 Z"/>
      <path d="M 277 30 Q 287 10 297 30 Z"/>
      <rect x="35" y="65" width="224" height="145" rx="4"/>
      <path d="M 95 65 Q 147 -30 199 65 Z"/>
      <path d="M 50 65 Q 72 25 94 65 Z"/>
      <path d="M 200 65 Q 222 25 244 65 Z"/>
    </g>

    <!-- 3. INDIA GATE (Delhi - PROMINENT CENTER LANDMARK) -->
    <g transform="translate(700, 20) scale(0.95)">
      <!-- Main Foundation & Outer Pillars -->
      <path d="M 20 220 L 20 50 L 50 20 L 190 20 L 220 50 L 220 220 L 170 220 L 170 120 Q 120 80 70 120 L 70 220 Z"/>
      <!-- Multi-tiered Cornices -->
      <rect x="30" y="-4" width="180" height="24" rx="3"/>
      <rect x="45" y="-24" width="150" height="20" rx="2"/>
      <rect x="65" y="-40" width="110" height="16" rx="2"/>
    </g>

    <!-- 4. Indian Sansad / Parliament (New Delhi - Right) -->
    <g transform="translate(1020, 80) scale(0.75)">
      <rect x="0" y="60" width="340" height="100" rx="8"/>
      <path d="M 20 60 L 20 160 M 50 60 L 50 160 M 80 60 L 80 160 M 110 60 L 110 160 M 140 60 L 140 160 M 170 60 L 170 160 M 200 60 L 200 160 M 230 60 L 230 160 M 260 60 L 260 160 M 290 60 L 290 160 M 320 60 L 320 160" stroke="#073B75" stroke-width="4"/>
      <path d="M 110 60 Q 170 -10 230 60 Z"/>
    </g>

    <!-- 5. Howrah Bridge (Kolkata - Far Right) -->
    <g transform="translate(1380, 85) scale(0.65)">
      <path d="M 0 170 L 70 20 L 140 170 M 260 170 L 330 20 L 400 170" stroke="#146ED1" stroke-width="6" fill="none"/>
      <line x1="70" y1="20" x2="330" y2="20" stroke="#146ED1" stroke-width="5"/>
      <line x1="0" y1="150" x2="400" y2="150" stroke="#146ED1" stroke-width="4"/>
    </g>

  </g>

  <!-- TRICOLOR WAVE AT BOTTOM EDGE -->
  <g transform="translate(0, 274)">
    <rect x="0" y="0" width="1600" height="2" fill="#FF9933" opacity="0.9"/>
    <rect x="0" y="2" width="1600" height="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="0" y="4" width="1600" height="2" fill="#138808" opacity="0.9"/>
  </g>
</svg>
