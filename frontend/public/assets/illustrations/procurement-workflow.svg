<svg width="600" height="480" viewBox="0 0 600 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Container Card -->
  <rect x="10" y="10" width="580" height="460" rx="16" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="10" y="10" width="580" height="460" rx="16" fill="url(#praman_hero_bg)"/>

  <!-- Top Title Bar -->
  <rect x="10" y="10" width="580" height="46" rx="16" fill="#F6F8FB"/>
  <circle cx="34" cy="33" r="5" fill="#FF5F56"/>
  <circle cx="50" cy="33" r="5" fill="#FFBD2E"/>
  <circle cx="66" cy="33" r="5" fill="#27C93F"/>
  <text x="560" y="37" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0B5CAD" text-anchor="end">PRAMAN DECISION SUPPORT FLOW</text>

  <!-- Step 1: Procurement Requirement (Top Left) -->
  <g transform="translate(30, 72)">
    <rect width="255" height="104" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="104" rx="3" fill="#0B5CAD"/>
    <text x="18" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="0.5">01 PROCUREMENT REQUIREMENT</text>
    <text x="18" y="44" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#172033">Industrial Safety Helmet</text>
    <text x="18" y="66" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Construction site head impact protection</text>
    <text x="18" y="84" font-family="Inter, sans-serif" font-size="11" fill="#64748B">with 50J drop impact &amp; 1000V insulation.</text>
    <rect x="185" y="14" width="56" height="18" rx="4" fill="#EBF3FA"/>
    <text x="213" y="26" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0B5CAD" text-anchor="middle">Tender PDF</text>
  </g>

  <!-- Arrow 1 Down -->
  <path d="M157 176 V198" stroke="#0B5CAD" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="157,204 153,194 161,194" fill="#0B5CAD"/>

  <!-- Step 2: Requirement Extraction (Middle Left) -->
  <g transform="translate(30, 208)">
    <rect width="255" height="110" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#B7791F"/>
    <text x="18" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#B7791F" letter-spacing="0.5">02 TECHNICAL PARAMETERS</text>
    
    <rect x="18" y="38" width="102" height="22" rx="4" fill="#EBF3FA"/>
    <text x="24" y="53" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0B5CAD">✓ Product: Helmet</text>
    
    <rect x="126" y="38" width="112" height="22" rx="4" fill="#EBF3FA"/>
    <text x="132" y="53" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0B5CAD">✓ App: Construction</text>

    <rect x="18" y="68" width="115" height="22" rx="4" fill="#EBF3FA"/>
    <text x="24" y="83" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0B5CAD">✓ Impact: 50 Joules</text>
    
    <rect x="139" y="68" width="98" height="22" rx="4" fill="#EBF3FA"/>
    <text x="145" y="83" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0B5CAD">✓ Insulation: 1kV</text>
  </g>

  <!-- Connection Arrow Horizontal to Right -->
  <path d="M285 263 H310" stroke="#138808" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="316,263 308,259 308,267" fill="#138808"/>

  <!-- Step 3: Standard Matching (Right Column Top) -->
  <g transform="translate(316, 72)">
    <rect width="254" height="246" rx="12" fill="white" stroke="#138808" stroke-width="2"/>
    
    <rect x="18" y="16" width="118" height="22" rx="11" fill="#E7F6E7"/>
    <text x="77" y="31" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#138808" text-anchor="middle">Strong Match 94%</text>

    <text x="18" y="60" font-family="Inter, sans-serif" font-size="15" font-weight="900" fill="#0B5CAD">PRAMAN Demo Standard 001</text>
    <text x="18" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#172033">Industrial Safety Helmets</text>

    <text x="18" y="100" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Covers physical &amp; impact performance</text>
    <text x="18" y="114" font-family="Inter, sans-serif" font-size="10" fill="#64748B">test evaluation for industrial headwear.</text>

    <line x1="18" y1="130" x2="236" y2="130" stroke="#E2E8F0" stroke-width="1"/>
    
    <text x="18" y="150" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Coverage: <tspan font-weight="700" fill="#138808">92%</tspan></text>
    <text x="130" y="150" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Technical: <tspan font-weight="700" fill="#138808">96%</tspan></text>
    <text x="18" y="170" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Application: <tspan font-weight="700" fill="#138808">94%</tspan></text>
    <text x="130" y="170" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Status: <tspan font-weight="700" fill="#0B5CAD">Current</tspan></text>

    <rect x="18" y="192" width="218" height="36" rx="6" fill="#0B5CAD"/>
    <text x="127" y="214" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">View Evidence Rationale →</text>
  </g>

  <!-- Step 4: Supporting Evidence Panel (Bottom) -->
  <g transform="translate(30, 336)">
    <rect width="540" height="110" rx="10" fill="#F6F8FB" stroke="#0B5CAD" stroke-width="1.5"/>
    <rect x="0" y="0" width="540" height="28" rx="10" fill="#EBF3FA"/>
    <text x="16" y="18" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#0B5CAD" letter-spacing="0.5">04 SUPPORTING EVIDENCE &amp; CLAUSE MATCHING</text>
    
    <text x="16" y="48" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#172033">Requirement Spec Clause 4.2 → Matched Standard Section 5</text>
    <text x="16" y="66" font-family="Inter, sans-serif" font-size="10" fill="#64748B">"Helmets must withstand a drop impact energy of 50 Joules without structural cracking."</text>
    
    <rect x="440" y="40" width="84" height="22" rx="4" fill="#E7F6E7"/>
    <text x="482" y="55" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#138808" text-anchor="middle">✓ Verified Match</text>
  </g>

  <defs>
    <linearGradient id="praman_hero_bg" x1="300" y1="10" x2="300" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F8FB"/>
    </linearGradient>
  </defs>
</svg>
