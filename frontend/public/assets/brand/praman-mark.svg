<svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="pramanMarkBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#073B75"/>
      <stop offset="100%" stop-color="#0B5CAD"/>
    </linearGradient>

    <!-- Green Check Badge Glow -->
    <filter id="markBadgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#138808" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(2, 2)">
    <!-- Main Rounded Shield Badge -->
    <rect width="48" height="48" rx="12" fill="url(#pramanMarkBg)"/>

    <!-- Subtle Tricolor Top Accent Line -->
    <path d="M 12 4 L 20 4" stroke="#FF9933" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 21 4 L 27 4" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 28 4 L 36 4" stroke="#138808" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Standard Document Sheet -->
    <path d="M 14 13 C 14 11.895 14.895 11 16 11 H 26 L 32 17 V 37 C 32 38.105 31.105 39 30 39 H 16 C 14.895 39 14 38.105 14 37 V 13 Z" fill="#FFFFFF"/>
    <path d="M 26 11 V 17 H 32" fill="#CBD5E1"/>

    <!-- Document Spec Lines -->
    <line x1="18" y1="18" x2="23" y2="18" stroke="#073B75" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="23" x2="26" y2="23" stroke="#073B75" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="28" x2="22" y2="28" stroke="#073B75" stroke-width="2" stroke-linecap="round"/>

    <!-- Micro Ashoka Chakra Wheel Lines -->
    <circle cx="21" cy="33" r="3.5" fill="none" stroke="#0B5CAD" stroke-width="0.8" opacity="0.5"/>
    <line x1="21" y1="29.5" x2="21" y2="36.5" stroke="#0B5CAD" stroke-width="0.6" opacity="0.5"/>
    <line x1="17.5" y1="33" x2="24.5" y2="33" stroke="#0B5CAD" stroke-width="0.6" opacity="0.5"/>

    <!-- Green Verification Checkmark Badge -->
    <g filter="url(#markBadgeGlow)">
      <circle cx="31" cy="31" r="7.5" fill="#138808" stroke="#FFFFFF" stroke-width="1.8"/>
      <path d="M 27.5 31 L 29.8 33.3 L 34.5 28.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
